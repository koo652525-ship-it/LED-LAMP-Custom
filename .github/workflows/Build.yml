name: Build LED LAMP APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: |
          unzip -o LED_LAMP_Custom_Fresh_Project.zip -d project

      - name: Build APK
        run: |
          PROJECT_DIR=$(find project -name settings.gradle -printf '%h\n' | head -n 1)
          echo "Project directory: $PROJECT_DIR"
          gradle -p "$PROJECT_DIR" assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LED-LAMP-APK
          path: project/**/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
